# ==============================================================================
# Home Assistant Package: XGIMI Horizon 20 Projector
#
# Place this file in your Home Assistant configuration directory under:
#   packages/xgimi_projector.yaml
#
# (Ensure your configuration.yaml includes packages:
#    homeassistant:
#      packages: !include_dir_named packages)
#
# The IP/hostname is defined ONCE below in `input_text.xgimi_projector_host`,
# and can also be viewed or changed directly in the Home Assistant GUI
# (Settings -> Devices & Services -> Helpers).
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Projector Host Helper (Editable in HA GUI or changed once here)
# ------------------------------------------------------------------------------
input_text:
  xgimi_projector_host:
    name: "XGIMI Projector Host"
    initial: "192.168.3.209"
    icon: mdi:ip-network

# ------------------------------------------------------------------------------
# 2. State Polling (Single HTTP GET every 10s)
# ------------------------------------------------------------------------------
rest:
  - resource_template: "http://{{ states('input_text.xgimi_projector_host') }}:8080/api/picture"
    scan_interval: 10
    timeout: 5
    binary_sensor:
      - name: "XGIMI Projector Power"
        unique_id: xgimi_projector_power
        device_class: power
        state: >-
          {{ value_json.awake if (value_json is defined and 'awake' in value_json) else false }}

    sensor:
      - name: "XGIMI Projector Status"
        unique_id: xgimi_projector_status
        icon: mdi:projector
        state: >-
          {{ 'on' if (value_json.awake | default(false)) else 'standby' }}
        json_attributes:
          - awake
          - currentInputSource
          - pictureMode
          - colorTemp
          - gameMode
          - brightness
          - contrast
          - saturation
          - sharpness
          - hue
          - wbRed
          - wbGreen
          - wbBlue

# ------------------------------------------------------------------------------
# 3. REST Commands (API Actions using dynamic host template)
# ------------------------------------------------------------------------------
rest_command:
  xgimi_power_on:
    url: "http://{{ states('input_text.xgimi_projector_host') }}:8080/api/power/on"
    method: POST
    timeout: 5

  xgimi_power_off:
    url: "http://{{ states('input_text.xgimi_projector_host') }}:8080/api/power/off"
    method: POST
    timeout: 5

  xgimi_power_toggle:
    url: "http://{{ states('input_text.xgimi_projector_host') }}:8080/api/power/toggle"
    method: POST
    timeout: 5

  xgimi_led_on:
    url: "http://{{ states('input_text.xgimi_projector_host') }}:8080/api/power/led-on"
    method: POST
    timeout: 5

  xgimi_led_off:
    url: "http://{{ states('input_text.xgimi_projector_host') }}:8080/api/power/led-off"
    method: POST
    timeout: 5

  xgimi_restart:
    url: "http://{{ states('input_text.xgimi_projector_host') }}:8080/api/power/restart"
    method: POST
    timeout: 5

  xgimi_switch_input:
    url: "http://{{ states('input_text.xgimi_projector_host') }}:8080/api/input"
    method: POST
    headers:
      Content-Type: application/json
    payload: '{"to": "{{ source }}"}'
    timeout: 5

  xgimi_set_picture:
    url: "http://{{ states('input_text.xgimi_projector_host') }}:8080/api/picture/{{ knob }}"
    method: POST
    headers:
      Content-Type: application/json
    payload: '{"value": {{ value | int }}}'
    timeout: 5

  xgimi_apply_preset:
    url: "http://{{ states('input_text.xgimi_projector_host') }}:8080/api/presets/{{ preset_id }}/apply"
    method: POST
    timeout: 5

  xgimi_keyevent:
    url: "http://{{ states('input_text.xgimi_projector_host') }}:8080/api/adb/keyevent/{{ key }}"
    method: POST
    timeout: 5

  xgimi_text:
    url: "http://{{ states('input_text.xgimi_projector_host') }}:8080/api/adb/text"
    method: POST
    headers:
      Content-Type: application/json
    payload: '{"text": {{ text | to_json }}}'
    timeout: 5

# ------------------------------------------------------------------------------
# 4. Interactive UI Entities (Switch, Selects, Buttons)
# ------------------------------------------------------------------------------
template:
  - switch:
      - name: "XGIMI Projector"
        unique_id: xgimi_projector_switch
        icon: mdi:projector
        state: "{{ is_state('binary_sensor.xgimi_projector_power', 'on') }}"
        turn_on:
          - action: rest_command.xgimi_power_on
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.xgimi_projector_status
        turn_off:
          - action: rest_command.xgimi_power_off
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.xgimi_projector_status

  - select:
      - name: "XGIMI Input Source"
        unique_id: xgimi_input_source
        icon: mdi:video-input-hdmi
        options:
          - "Apps"
          - "HDMI 1"
          - "HDMI 2"
        state: >-
          {% set src = state_attr('sensor.xgimi_projector_status', 'currentInputSource') %}
          {% if src == 'E_INPUT_SOURCE_STORAGE' %}Apps
          {% elif src == 'E_INPUT_SOURCE_HDMI1' %}HDMI 1
          {% elif src == 'E_INPUT_SOURCE_HDMI2' %}HDMI 2
          {% else %}unknown{% endif %}
        select_option:
          - action: rest_command.xgimi_switch_input
            data:
              source: >-
                {% if option == 'Apps' %}STORAGE
                {% elif option == 'HDMI 1' %}HDMI1
                {% elif option == 'HDMI 2' %}HDMI2
                {% endif %}
          - delay: "00:00:01"
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.xgimi_projector_status

      - name: "XGIMI Picture Mode"
        unique_id: xgimi_picture_mode
        icon: mdi:television-guide
        options:
          - "Movie"
          - "Football"
          - "Office"
          - "Game"
          - "User"
        state: >-
          {% set mode = state_attr('sensor.xgimi_projector_status', 'pictureMode') %}
          {% set map = {1: 'Movie', 9: 'Football', 6: 'Office', 4: 'Game', 3: 'User'} %}
          {{ map.get(mode, 'unknown') }}
        select_option:
          - action: rest_command.xgimi_set_picture
            data:
              knob: "picture-mode"
              value: >-
                {% set rev = {'Movie': 1, 'Football': 9, 'Office': 6, 'Game': 4, 'User': 3} %}
                {{ rev.get(option, 1) }}
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.xgimi_projector_status

      - name: "XGIMI Color Temperature"
        unique_id: xgimi_color_temp
        icon: mdi:palette
        options:
          - "System"
          - "Warm"
          - "Standard"
          - "Cold"
          - "User"
        state: >-
          {% set ct = state_attr('sensor.xgimi_projector_status', 'colorTemp') %}
          {% set map = {0: 'System', 1: 'Warm', 2: 'Standard', 3: 'Cold', 4: 'User'} %}
          {{ map.get(ct, 'unknown') }}
        select_option:
          - action: rest_command.xgimi_set_picture
            data:
              knob: "color-temp"
              value: >-
                {% set rev = {'System': 0, 'Warm': 1, 'Standard': 2, 'Cold': 3, 'User': 4} %}
                {{ rev.get(option, 0) }}
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.xgimi_projector_status

      - name: "XGIMI Game Mode"
        unique_id: xgimi_game_mode
        icon: mdi:gamepad-variant
        options:
          - "Off"
          - "Standard"
          - "Boost"
        state: >-
          {% set gm = state_attr('sensor.xgimi_projector_status', 'gameMode') %}
          {% set map = {0: 'Off', 1: 'Standard', 2: 'Boost'} %}
          {{ map.get(gm, 'unknown') }}
        select_option:
          - action: rest_command.xgimi_set_picture
            data:
              knob: "game-mode"
              value: >-
                {% set rev = {'Off': 0, 'Standard': 1, 'Boost': 2} %}
                {{ rev.get(option, 0) }}
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.xgimi_projector_status

  - button:
      - name: "XGIMI Auto Focus"
        unique_id: xgimi_button_autofocus
        icon: mdi:camera-iris
        press:
          action: rest_command.xgimi_keyevent
          data:
            key: 140

      - name: "XGIMI Settings Dashboard"
        unique_id: xgimi_button_settings
        icon: mdi:cog
        press:
          action: rest_command.xgimi_keyevent
          data:
            key: 176

      - name: "XGIMI Lamp Off"
        unique_id: xgimi_button_lamp_off
        icon: mdi:lightbulb-off
        press:
          action: rest_command.xgimi_led_off

      - name: "XGIMI Lamp On"
        unique_id: xgimi_button_lamp_on
        icon: mdi:lightbulb-on
        press:
          action: rest_command.xgimi_led_on

      - name: "XGIMI Restart Projector"
        unique_id: xgimi_button_restart
        icon: mdi:restart
        press:
          action: rest_command.xgimi_restart
